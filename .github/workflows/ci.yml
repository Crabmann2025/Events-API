name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker-Image bauen
      - name: Build Docker image
        run: docker build -t events-api:latest .

      # Container starten
      - name: Start Docker container
        run: |
          # Startet den Container im Detached-Modus (-d) und gibt ihm einen Namen
          docker run -d --name events-api-container -p 5000:5000 events-api:latest
          
          # Kurz warten, damit Flask im Container Zeit hat hochzufahren
          sleep 5

      # Health-Check prüfen
      - name: Check API Health
        run: |
          # Ruft den Health-Endpoint der API auf. 
          curl -f http://localhost:5000/api/health || exit 1

      # Python einrichten
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Abhängigkeiten installieren
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Stellt sicher, dass pytest installiert ist, falls es in der requirements.txt fehlt
          pip install pytest requests 

      # Tests ausführen
      - name: Run test suite
        run: |
          # Führt pytest gegen den laufenden Container aus
          pytest -v

      # Container aufräumen
      - name: Cleanup Container
        if: always()
        run: |
          # Stoppt und löscht den Container. "|| true" verhindert, dass dieser Step 
          # fehlschlägt, falls der Container aus irgendeinem Grund schon weg ist.
          docker stop events-api-container || true
          docker rm events-api-container || true

  # Der Deploy-Job
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crabmann/events-api-final:latest

      - name: Trigger Render Deployment
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for Rollout
        run: sleep 60

      - name: Smoke Test against Render
        run: |
          echo "Prüfe Live-URL..."
          curl -f "${{ secrets.RENDER_BASE_URL }}/api/health"